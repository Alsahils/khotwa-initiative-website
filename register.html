<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Unavailable | Khotwa Initiative</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts for English (Inter) and Arabic (Cairo) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#800020',
                            light: '#a31a3f',
                            dark: '#5a0014'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Custom Styles -->
    <link href="styles.css" rel="stylesheet">
</head>

<body
    class="bg-gray-50 text-gray-800 antialiased selection:bg-brand selection:text-white transition-colors duration-300 min-h-screen flex flex-col items-center justify-center">

    <main class="w-full max-w-md mx-auto p-6 relative z-10">
        <div class="bg-white rounded-[2rem] shadow-2xl shadow-brand/10 p-8 md:p-12 text-center border border-gray-100">
            <!-- Logo area -->
            <div class="flex justify-center mb-8">
                <a href="index.html" class="inline-block hover:scale-105 transition-transform duration-300">
                    <img src="./image/khotwa-logo.jpeg" alt="Khotwa Logo" class="h-24 w-auto object-contain">
                </a>
            </div>

            <!-- Icon -->
            <div
                class="mb-6 inline-flex items-center justify-center w-20 h-20 rounded-full bg-brand/5 text-brand mx-auto">
                <i data-lucide="clock" class="w-10 h-10"></i>
            </div>

            <!-- Content -->
            <h1 data-i18n="regUnavailableTitle" class="text-3xl font-extrabold text-gray-900 mb-4 tracking-tight">
                Registration is Currently Closed</h1>
            <p data-i18n="regUnavailableDesc" class="text-gray-500 text-lg mb-8 leading-relaxed">
                Thank you for your interest in the Khotwa Initiative. Our registration period has ended for this cohort.
                Please check back later or follow our social media for updates on the next intake!
            </p>

            <!-- Back Button -->
            <a href="index.html"
                class="inline-flex items-center justify-center gap-2 bg-brand text-white px-8 py-4 rounded-full font-bold text-lg hover:bg-brand-light transition duration-300 shadow-xl shadow-brand/30 transform hover:-translate-y-1 w-full focus:ring-4 focus:ring-brand/50">
                <i data-lucide="arrow-left" class="w-5 h-5 rtl:rotate-180"></i>
                <span data-i18n="goBackHome">Return to Home</span>
            </a>
        </div>
    </main>

    <!-- Decorative background elements -->
    <div
        class="absolute top-0 end-0 -z-10 w-2/3 h-full bg-brand/5 rounded-bl-[100px] rtl:rounded-bl-none rtl:rounded-br-[100px] opacity-70 blur-3xl pointer-events-none">
    </div>
    <div
        class="absolute bottom-0 start-0 -z-10 w-1/3 h-1/2 bg-brand/10 rounded-tr-[100px] rtl:rounded-tr-none rtl:rounded-tl-[100px] opacity-60 blur-3xl pointer-events-none">
    </div>

    <script>
        // Use basic multi-language from local storage if available, default to ar
        const savedLang = localStorage.getItem('khotwa_lang') || 'ar';
        document.documentElement.setAttribute('lang', savedLang);
        document.documentElement.setAttribute('dir', savedLang === 'ar' ? 'rtl' : 'ltr');

        // Initialize lucide icons
        lucide.createIcons();
    </script>
    <script src="scripts.js"></script>
</body>

</html>
